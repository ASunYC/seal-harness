# Cordis 配置组合，不是源码补丁。
- id: ui-brand-official
  disabled: true
- id: desktop-updates
  disabled: true
- id: ui-sidebar-browser
  disabled: false
- id: ui-settings-models
  config:
    credentialOnboarding: false
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: >-
      你是“Seal Harness”开发者平台中的 AI 助手。面向用户时只以“Seal Harness”或“Seal Harness 助手”自称，不以 DeepSeek、DeepSeek 官方助手、Harness、ChatGPT 或任何底层模型服务名称作为产品身份。底层模型和服务只负责实现，不改变产品身份。默认使用中文，准确、简洁地帮助用户完成开发、分析和知识工作。
    personaSuffix: >-
      当前工作目录是 {{cwd}}。

# 开启会话全文搜索。上游 base 层用 `openAt: never` + `:memory:` 保持
# ctx.sessionQuery 挂载但不建索引，此时侧栏搜索只能匹配标题与工作区名。
# 覆盖为持久索引后，侧栏搜索可检索会话正文，对应 cc-haha 的跨会话搜索。
# `first-search` 让 SQLite 首次搜索才打开，不拖慢启动。
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

- insert:
    - id: seal-harness-brand
      name: seal-harness-desktop
    - id: seal-harness-local-data
      name: '@seal-harness/local-data'
    - id: seal-harness-identity
      name: '@seal-harness/identity'
    - id: seal-harness-user
      name: '@seal-harness/user'
    - id: seal-harness-navigation
      name: '@seal-harness/navigation'
    - id: ask-jev
      name: dsh-plugin-ask-jev
    - id: seal-harness-store
      name: '@seal-harness/store'
    - id: seal-harness-connectors
      name: '@seal-harness/connectors'
    - id: seal-harness-skills
      name: '@seal-harness/skills'
    - id: seal-harness-experts
      name: '@seal-harness/experts'
    - id: seal-harness-session-context-selector
      name: '@seal-harness/session-context-selector'

# cc-haha 功能对齐：官方 Host 能力按需装配。这些包已随 Beta Desktop 安装，
# 但活动 web profile 模板（dsh-base + dsh-web-app）未包含对应行。
# 单独成块便于按能力回退。
- insert:
    # 应用内持久 PTY 注册；上游 UI 行 ui-sidebar-terminal 已装配，此前缺此 Host。
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    # MCP 客户端不在此静态装配：dsh-mcp-client 按 MCP server 逐实例化，
    # 每行需要 serverName 与传输配置，由 DSH 的 MCP 设置入口在用户添加服务器时创建。
    # 上游 mcp-resources 已装配，连接端随 server 配置出现。
    # 工作流编排运行时；上游 tool-workflow 与 ui-workflow-run 已装配，此前缺编排端。
    - id: workflow
      name: '@deepseek-ai/dsh-workflow'
    # 向用户提问工具；上游 ui-user-questions 已装配，此前无提问工具。
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    # 计划任务 Host；上游 ui-schedule 已装配，此前只有界面空态而无调度服务。
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

# 语音输入成套装配（对应官方 OPTIONAL_BUNDLES 之一）。
# 四行同时提供 STT 服务、本地 SenseVoice provider、远端 API provider 与输入界面。
- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'

# Agent Teams 未在此启用：官方 agent-team-profile 会同时禁用 subagent 委派工具
# （tool-subagent / tool-subagent-control / tool-subagent-list-agents / tool-subagent-fork），
# 属于改变产品默认行为的决策，需用户确认后再装配。
