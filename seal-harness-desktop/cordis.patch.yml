# cc-haha 功能对齐：官方 Host 能力按需装配。这些包已随 Beta Desktop 安装，
# 但活动 web profile 模板（dsh-base + dsh-web-app）未包含对应行。
# 单独成块便于按能力回退。
- insert:
    # 应用内持久 PTY 注册；上游 UI 行 ui-sidebar-terminal 已装配，此前缺此 Host。
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    # MCP 客户端不在此静态装配：dsh-mcp-client 按 MCP server 逐实例化，
    # 每行需要 serverName 与传输配置，由 DSH 的 MCP 设置入口在用户添加服务器时创建。
    # 上游 mcp-resources 已装配，连接端随 server 配置出现。
    # 工作流编排运行时；上游 tool-workflow 与 ui-workflow-run 已装配，此前缺编排端。
    - id: workflow
      name: '@deepseek-ai/dsh-workflow'
    # 向用户提问工具；上游 ui-user-questions 已装配，此前无提问工具。
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# 语音输入成套装配（对应官方 OPTIONAL_BUNDLES 之一）。
# 四行同时提供 STT 服务、本地 SenseVoice provider、远端 API provider 与输入界面。
- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'

# Browser Use 装配（playwright-mcp 驱动）。
# 两行：browserUse Service 注册层 + 驱动层。
# dsh-browser-use 只提供一个 BrowserUseRegistry Service（key: "browserUse"），
# 不注册任何工具，是驱动层的 peer 依赖。
# dsh-experimental-browser-use-playwright-mcp 在每个 Agent session 里
# 用 ctx.plugin(McpClient, ...) 按需起一个 stdio 子进程连到 @playwright/mcp，
# 无需任何 framework 级 mcp-client 静态行。
# 注：enableScripts: false 阻止 playwright postinstall 下载 Chromium，
# 使用系统 Chromium 或在安装后手动运行 `playwright install chromium`。
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: experimental-browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: launch
        headless: true
        executablePath: 'C:\Program Files\Google\Chrome\Application\chrome.exe'

# Agent Teams（实验性），复刻官方 agent-team-profile bundle 的 insert 部分。
# 该 bundle 是 dsh.bundle.patch，只能进 profile 的 dsh.profile.bundles，
# 而 desktopBundleList 会按 REQUIRED_BUNDLES 重写该列表，产品层无法注入，
# 因此直接在这里插入它的三行。
# bundle 另有 4 行禁用全局 tool-subagent*，dsh-web-app 顶层已禁用同样 4 行
# （Web 预设在各自作用域挂载 subagent 控件），故无需重复，现有委派能力不变。
- insert:
    # ImageGen + ImageEdit 工具；凭据通过 DSH credentials 管理（BaseURL + API Key + Model）。
    # 支持 OpenAI Images API 兼容接口（/v1/images/generations + /v1/images/edits）。
    # 图片保存到 ~/.seal-harness/images/<YYYY-MM-DD>/。
    - id: seal-harness-image-generation
      name: '@seal-harness/image-generation'
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
