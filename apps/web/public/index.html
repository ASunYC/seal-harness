<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seal Harness</title>
    <link rel="icon" type="image/png" href="/assets/seal-harness-mascot.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-mark" src="/assets/seal-harness-mascot.png" alt=""><span>Seal Harness</span></div>
        <button id="new-session" class="primary wide">New session</button>
        <div class="section-label">Sessions</div>
        <div id="sessions" class="sessions"></div>
        <details class="settings">
          <summary>Connection</summary>
          <label>Workspace<input id="cwd" type="text"></label>
          <label>Provider<select id="provider"></select></label>
          <label>Model<select id="model"></select></label>
          <label>Reasoning<select id="reasoning">
            <option value="">Default</option><option>off</option><option>low</option>
            <option>medium</option><option>high</option><option>max</option>
          </select></label>
          <label>API key<input id="api-key" type="password" autocomplete="off" placeholder="kept in memory"></label>
          <button id="save-key">Set API key</button>
        </details>
      </aside>
      <main class="main">
        <header><div><strong id="session-title">New session</strong><span id="status">Ready</span></div></header>
        <section id="transcript" class="transcript">
          <div id="welcome" class="welcome"><img class="hero-mark" src="/assets/seal-harness-mascot.png" alt="Seal mascot"><h1>What should we work on?</h1><p>Choose a workspace, configure a model, and give the agent a task.</p></div>
        </section>
        <section id="approvals" class="approvals"></section>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="Ask Seal Harness to inspect, edit, or run…"></textarea>
          <div class="composer-actions"><span id="run-meta"></span><button id="cancel" type="button" hidden>Stop</button><button class="primary" type="submit">Run</button></div>
        </form>
      </main>
    </div>
    <div id="credential-onboarding" class="modal-backdrop" hidden>
      <form id="credential-onboarding-form" class="onboarding-dialog" role="dialog" aria-modal="true" aria-labelledby="credential-onboarding-title">
        <h2 id="credential-onboarding-title">添加一个 API Key 开始使用</h2>
        <p>配置 DeepSeek 官方模型，即可开始使用。</p>
        <label for="onboarding-api-key">API 密钥</label>
        <input id="onboarding-api-key" type="password" autocomplete="off" placeholder="输入 API 密钥">
        <div id="onboarding-error" class="onboarding-error" role="alert"></div>
        <div class="onboarding-actions">
          <button id="onboarding-later" type="button">稍后配置</button>
          <button id="onboarding-save" class="primary" type="submit" disabled>保存并继续</button>
        </div>
      </form>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
