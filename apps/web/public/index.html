<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seal Harness</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="mark">π</span><span>Seal Harness</span></div>
        <button id="new-session" class="primary wide">New session</button>
        <div class="section-label">Sessions</div>
        <div id="sessions" class="sessions"></div>
        <details class="settings">
          <summary>Connection</summary>
          <label>Workspace<input id="cwd" type="text"></label>
          <label>Provider<select id="provider"></select></label>
          <label>Model<select id="model"></select></label>
          <label>Reasoning<select id="reasoning">
            <option value="">Default</option><option>off</option><option>low</option>
            <option>medium</option><option>high</option><option>max</option>
          </select></label>
          <label>API key<input id="api-key" type="password" autocomplete="off" placeholder="kept in memory"></label>
          <button id="save-key">Set API key</button>
        </details>
      </aside>
      <main class="main">
        <header><div><strong id="session-title">New session</strong><span id="status">Ready</span></div></header>
        <section id="transcript" class="transcript">
          <div id="welcome" class="welcome"><div class="hero-mark">π</div><h1>What should we work on?</h1><p>Choose a workspace, configure a model, and give the agent a task.</p></div>
        </section>
        <section id="approvals" class="approvals"></section>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="Ask Seal Harness to inspect, edit, or run…"></textarea>
          <div class="composer-actions"><span id="run-meta"></span><button id="cancel" type="button" hidden>Stop</button><button class="primary" type="submit">Run</button></div>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
