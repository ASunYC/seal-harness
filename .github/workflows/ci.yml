name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 22.19
            os: ubuntu-latest
            node: 22.19.0
          - name: Linux / Node 24
            os: ubuntu-latest
            node: 24
          - name: Windows / Node 24
            os: windows-latest
            node: 24
          - name: macOS arm64 / Node 24
            os: macos-15
            node: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Import built kernel
        run: node --input-type=module -e "await import('./packages/kernel/dist/index.js')"

  pack-smoke:
    name: Packed install smoke
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack and install
        run: pnpm pack:smoke
