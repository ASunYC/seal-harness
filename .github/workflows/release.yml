name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version without v prefix
        required: true
        default: 0.2.1-candidate
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: seal-harness-packages
          path: .artifacts/packs/*.tgz
          if-no-files-found: error

  bundle:
    needs: verify-and-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: seal-harness-windows-x64.zip
            archive: zip
          - runner: ubuntu-latest
            asset: seal-harness-linux-x64.tar.gz
            archive: tar
          - runner: macos-15
            asset: seal-harness-macos-arm64.tar.gz
            archive: tar
          - runner: macos-15-intel
            asset: seal-harness-macos-x64.tar.gz
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/download-artifact@v7
        with:
          name: seal-harness-packages
          path: .artifacts/packs
      - run: pnpm release:bundle
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem .artifacts/release -Directory | Select-Object -First 1
          Compress-Archive -LiteralPath $bundle.FullName -DestinationPath ".artifacts/release/${{ matrix.asset }}"
          $extract = Join-Path $env:RUNNER_TEMP "seal-harness-release-smoke"
          Expand-Archive -LiteralPath ".artifacts/release/${{ matrix.asset }}" -DestinationPath $extract
          $extracted = Join-Path $extract $bundle.Name
          & (Join-Path $extracted "seal-harness.cmd") help
          $doubleClick = Join-Path $extracted "Start Seal Harness.cmd"
          if (-not (Test-Path -LiteralPath $doubleClick)) { throw "Windows double-click launcher is missing" }
          $env:SEAL_HARNESS_START_ARGS = "help"
          & $doubleClick
          if ($LASTEXITCODE -ne 0) { throw "Windows double-click launcher smoke failed: $LASTEXITCODE" }
      - if: matrix.archive == 'tar'
        shell: bash
        run: |
          bundle=$(find .artifacts/release -mindepth 1 -maxdepth 1 -type d | head -n 1)
          tar -C "$(dirname "$bundle")" -czf ".artifacts/release/${{ matrix.asset }}" "$(basename "$bundle")"
          extract="$RUNNER_TEMP/seal-harness-release-smoke"
          mkdir -p "$extract"
          tar -xzf ".artifacts/release/${{ matrix.asset }}" -C "$extract"
          "$extract/$(basename "$bundle")/seal-harness" help
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: .artifacts/release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum seal-harness-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "Seal Harness $GITHUB_REF_NAME" \
              --notes-file "docs/release-notes-${RELEASE_VERSION}.md"
          fi
