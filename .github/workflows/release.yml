name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: piharness-packages
          path: .artifacts/packs/*.tgz
          if-no-files-found: error
